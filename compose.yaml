services:
    one:
        network_mode: host
        build:
            network: host
            args:
                - BUILD_DATE
                - GIT_COMMIT
                - GIT_COMMIT_DATE
                - IMAGE_NAME
                - PROJECT
                - USER_GID
                - USER_UID
                - VERSION
            context: .
        entrypoint: ''
        environment:
            - GIT_COMMIT
            - VERSION
        image: 'one:latest'
        stdin_open: true
        tty: true
        volumes:
            - type: bind
              source: ${ROOT_DIR}/dist
              target: /home/user_one/one/dist
              read_only: false
            - type: bind
              source: ${ROOT_DIR}/nfpm.yaml
              target: /home/user_one/one/nfpm.yaml
              read_only: false

